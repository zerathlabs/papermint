[package]
name = "papermint-mobile"
version = "0.1.1"
edition = "2024"
description = "C-ABI and mobile engine bindings for papermint (React Native, Expo, Flutter, iOS, Android)"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
papermint = { path = "../..", default-features = false, features = ["std", "escpos", "star", "image"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
