[package]
name = "papermint-daemon"
version = "0.2.1"
edition = "2024"
description = "Lightweight native HTTP print sidecar daemon for papermint"
license = "MIT"
publish = false

[[bin]]
name = "papermintd"
path = "src/main.rs"

[features]
default = ["serial", "usb", "image"]
serial = []
usb = []
image = []

[dependencies]
papermint = { path = "../..", default-features = true, features = ["serial", "usb", "image"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }


