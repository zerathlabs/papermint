[package]
name = "papermint"
version = "0.1.0"
edition = "2024"
description = "A fast, multi-vendor, type-safe thermal receipt printing library for Rust."
license = "MIT OR Apache-2.0"
keywords = ["thermal", "escpos", "pos", "receipt", "printer"]
categories = ["hardware-support", "embedded"]

[features]
default = ["std", "escpos", "star", "async", "tcp"]
std = []
async = ["dep:tokio", "dep:async-trait"]
escpos = []
star = []
tcp = ["async"]
image = []

[dependencies]
thiserror = "2"
async-trait = { version = "0.1", optional = true }
tokio = { version = "1", features = ["net", "time", "io-util"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
