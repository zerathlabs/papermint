[package]
name = "papermint"
version = "0.2.1"
edition = "2024"
description = "High-performance, type-safe thermal receipt printing for Rust, Node.js & Mobile"
license = "MIT"
readme = "README.md"
repository = "https://github.com/zerathlabs/papermint"
homepage = "https://papermint.zerathlabs.com"
documentation = "https://docs.rs/papermint"
keywords = ["escpos", "thermal-printer", "receipt", "pos", "printing"]
categories = ["hardware-support", "encoding"]

[workspace]
members = [
    ".",
    "crates/papermint-node",
    "crates/papermint-daemon",
    "crates/papermint-mobile",
]

[features]
default = ["std", "escpos", "star", "async", "tcp"]
std = []
async = ["dep:tokio", "dep:async-trait"]
escpos = []
star = []
tcp = ["async"]
serial = ["async", "dep:tokio-serial"]
usb = ["async", "dep:nusb"]
image = ["dep:image"]

[dependencies]
thiserror = "2"
async-trait = { version = "0.1", optional = true }
tokio = { version = "1", features = ["net", "time", "io-util"], optional = true }
tokio-serial = { version = "5.4", optional = true }
nusb = { version = "0.2", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
unicode-width = "0.2.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
criterion = "0.5"

[[bench]]
name = "receipt_benchmarks"
harness = false

