name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Pre-Release Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --check

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Test Suite
        run: cargo test --workspace --all-features

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Test Node Bindings
        working-directory: crates/papermint-node
        run: |
          pnpm install
          pnpm run build
          pnpm test

      - name: Verify Expo Module Build
        working-directory: packages/expo-papermint
        run: |
          pnpm install
          pnpm run build

  build-daemon:
    name: Build Daemon Binary (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: papermintd
            asset_name: papermintd-${{ github.ref_name }}-linux-x86_64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: papermintd
            asset_name: papermintd-${{ github.ref_name }}-macos-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: papermintd.exe
            asset_name: papermintd-${{ github.ref_name }}-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build papermintd
        run: cargo build --package papermint-daemon --release --target ${{ matrix.target }}

      - name: Package Release Asset (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ${{ matrix.asset_name }} ${{ matrix.binary_name }}
          mv ${{ matrix.asset_name }} ../../../

      - name: Package Release Asset (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ${{ matrix.asset_name }} ${{ matrix.binary_name }}
          mv ${{ matrix.asset_name }} ../../../

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  github-release:
    name: Publish GitHub Release
    needs: [build-daemon, build-expo-android, build-expo-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'papermint*'
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

  publish-crates-io:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish Label Engine Crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --package papermint-label

      - name: Wait for crates.io index propagation
        run: sleep 10

      - name: Publish Core Crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --package papermint

  build-node-bindings:
    name: Build Node.js Native Module (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: node-linux-x64
          - os: windows-latest
            artifact_name: node-win32-x64
          - os: macos-latest
            artifact_name: node-darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Build Native Module
        working-directory: crates/papermint-node
        run: |
          pnpm install
          pnpm run build

      - name: Upload Native .node Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: crates/papermint-node/*.node

  publish-npm:
    name: Publish Universal npm Package
    needs: [validate, build-node-bindings]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js Auth
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        working-directory: crates/papermint-node
        run: pnpm install

      - name: Download All Platform Native Modules
        uses: actions/download-artifact@v4
        with:
          pattern: node-*
          path: crates/papermint-node
          merge-multiple: true

      - name: Verify Bundled Native Modules
        working-directory: crates/papermint-node
        run: |
          echo "Bundled native .node binaries for universal npm release:"
          ls -la *.node

      - name: Publish to npm
        working-directory: crates/papermint-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --access public

  build-expo-android:
    name: Build Android JNI Libraries (.so)
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set Android NDK Path
        run: |
          if [ -z "$ANDROID_NDK_HOME" ] && [ -n "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          fi

      - name: Build Android .so Binaries
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o jniLibs build --package papermint-mobile --release

      - name: Package Android Release Archive
        run: |
          zip -r papermint-mobile-android-${{ github.ref_name }}.zip jniLibs

      - name: Upload Android JNI Libraries
        uses: actions/upload-artifact@v4
        with:
          name: expo-android-jni-libs
          path: jniLibs

      - name: Upload Android Release Zip
        uses: actions/upload-artifact@v4
        with:
          name: papermint-mobile-android-${{ github.ref_name }}.zip
          path: papermint-mobile-android-${{ github.ref_name }}.zip

  build-expo-ios:
    name: Build iOS XCFramework
    needs: validate
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build iOS Device Static Library
        run: cargo build --package papermint-mobile --target aarch64-apple-ios --release

      - name: Build iOS Simulator Static Libraries
        run: |
          cargo build --package papermint-mobile --target aarch64-apple-ios-sim --release
          cargo build --package papermint-mobile --target x86_64-apple-ios --release

      - name: Merge Simulator Binaries & Package XCFramework
        run: |
          mkdir -p target/ios-sim/release
          lipo -create \
            target/aarch64-apple-ios-sim/release/libpapermint_mobile.a \
            target/x86_64-apple-ios/release/libpapermint_mobile.a \
            -output target/ios-sim/release/libpapermint_mobile.a

          mkdir -p xcframework-headers
          cp crates/papermint-mobile/include/papermint.h xcframework-headers/

          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libpapermint_mobile.a \
            -headers xcframework-headers \
            -library target/ios-sim/release/libpapermint_mobile.a \
            -headers xcframework-headers \
            -output PapermintMobile.xcframework

      - name: Package iOS Release Archive
        run: |
          zip -r papermint-mobile-ios-${{ github.ref_name }}.zip PapermintMobile.xcframework crates/papermint-mobile/include/papermint.h

      - name: Upload iOS XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: expo-ios-xcframework
          path: PapermintMobile.xcframework

      - name: Upload iOS Release Zip
        uses: actions/upload-artifact@v4
        with:
          name: papermint-mobile-ios-${{ github.ref_name }}.zip
          path: papermint-mobile-ios-${{ github.ref_name }}.zip

  publish-expo-npm:
    name: Publish expo-papermint to npm
    needs: [validate, build-expo-android, build-expo-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js Auth
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Download Android JNI libs
        uses: actions/download-artifact@v4
        with:
          name: expo-android-jni-libs
          path: packages/expo-papermint/android/src/main/jniLibs

      - name: Download iOS XCFramework
        uses: actions/download-artifact@v4
        with:
          name: expo-ios-xcframework
          path: packages/expo-papermint/ios/PapermintMobile.xcframework

      - name: Verify Bundled Native Assets
        working-directory: packages/expo-papermint
        run: |
          echo "Android JNI Libs:"
          ls -la android/src/main/jniLibs/ || true
          echo "iOS XCFramework:"
          ls -la ios/PapermintMobile.xcframework/ || true

      - name: Build & Publish expo-papermint
        working-directory: packages/expo-papermint
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: env.NODE_AUTH_TOKEN != ''
        run: |
          pnpm install
          pnpm run build
          pnpm publish --access public --no-git-checks
